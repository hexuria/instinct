# Determinism guard rails (spec §5 rule 3): no unordered maps, clocks, RNG or env reads in
# library code. Tests may unwrap/expect.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is unspecified; use BTreeMap or a sorted Vec (spec §5 rule 3)" },
    { path = "std::collections::HashSet", reason = "iteration order is unspecified; use BTreeSet or a sorted Vec (spec §5 rule 3)" },
]
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "no clocks in Instinct(spec §5 rule 3)" },
    { path = "std::time::Instant::now", reason = "no clocks in Instinct(spec §5 rule 3)" },
    { path = "std::env::var", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::var_os", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::vars", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::args", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::args_os", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::current_dir", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::temp_dir", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::home_dir", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::env::current_exe", reason = "no environment reads in Instinct(spec §5 rule 3)" },
    { path = "std::process::exit", reason = "no process exits in Instinct(spec §5 rule 3)" },
]
# Thread-locals are banned by spec §5 rule 3 as well; clippy 1.99 supports disallowed-macros.
# Residual gap: a local `macro_rules!` wrapper around `thread_local!` is not caught — the
# `std::thread_local` invocation itself still is.
disallowed-macros = [
    { path = "std::thread_local", reason = "no thread-locals in Instinct(spec §5 rule 3)" },
]
