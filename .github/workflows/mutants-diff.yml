# Mutation testing scoped to the PR diff (spec §5.1, after open-ai-gateway scripts/mutants-diff.py).
# Advisory: not part of ci-ok until the baseline is clean; survivors are listed in the job log.
name: Mutants (diff)

on:
  pull_request:
    paths: ["crates/**", "packs/**"]

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants-in-diff:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants,cargo-nextest
      - run: git diff "origin/${{ github.base_ref }}...HEAD" -- crates packs > pr.diff
      - run: cargo mutants --workspace --in-diff pr.diff --test-tool nextest --timeout-multiplier 3 --no-shuffle -vV
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff-out
          path: mutants.out
          if-no-files-found: ignore
