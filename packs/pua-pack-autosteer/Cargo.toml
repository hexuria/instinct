[package]
name = "pua-pack-autosteer"
description = "PUA (Predictable Universal Advisor): autosteer pack — queue / steer / interrupt delivery advice."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## Target selection over live runs (spec §6.1 Phase B). Off by default until PRD Phase B.
target-selection = ["dep:pua-hdc"]

[dependencies]
pua-core = { workspace = true, features = ["serde"] }
pua-text.workspace = true
pua-lexicon = { workspace = true, features = ["serde"] }
pua-rules = { workspace = true, features = ["serde"] }
pua-explain.workspace = true
pua-hdc = { workspace = true, optional = true }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
unicode-normalization.workspace = true

[[example]]
name = "replay"
path = "examples/replay.rs"

[[example]]
name = "write_golden"
path = "examples/write_golden.rs"

[[example]]
name = "eval"
path = "examples/eval.rs"
required-features = []

[lints]
workspace = true
