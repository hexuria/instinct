[package]
name = "instinct-lexicon"
description = "Instinct: closed-vocabulary matching: token-boundary exact, longest known code, bounded edit distance."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["lexicon", "vocabulary", "typo-tolerance", "matching", "deterministic"]
categories = ["algorithms", "text-processing"]

[features]
default = []
## Deserialize `LexiconSpec` from consumer data (TOML/JSON). Validation still happens in `Lexicon::new`.
serde = ["dep:serde", "instinct-core/serde"]

[dependencies]
instinct-core.workspace = true
instinct-text.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
unicode-normalization.workspace = true
toml.workspace = true

[lints]
workspace = true
