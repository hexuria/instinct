[package]
name = "instinct-core"
description = "Instinct: core types (Question/Answer shapes, Millis, Confidence, Span, DataVersion, profiles, decide, candidate sets, trail)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["decision-engine", "deterministic", "abstain", "arbitration", "scoring"]
categories = ["algorithms"]

[features]
default = []
## Serialize/deserialize core types (validated on the way in). Enabled by instinct-explain.
serde = ["dep:serde"]

[dependencies]
blake3.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
