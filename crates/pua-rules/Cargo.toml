[package]
name = "pua-rules"
description = "PUA (Predictable Universal Advisor): compiled rule packs: cues, negation, scope; no regex in rule data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## Deserialize `RuleSetSpec` from pack data (TOML/JSON). Validation still happens in `RuleSet::new`.
serde = ["dep:serde", "pua-core/serde", "pua-lexicon/serde"]

[dependencies]
pua-core.workspace = true
pua-lexicon.workspace = true
pua-text.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
pua-explain.workspace = true
proptest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
unicode-normalization.workspace = true
toml.workspace = true

[lints]
workspace = true
