# cargo-mutants config (skill §2 "Logic" chaos layer). Survivor triage: docs/verification.md.
additional_cargo_args = ["--all-features"]
test_tool = "nextest"
# Pure re-exports, Debug/Display boilerplate for error types are not decision logic.
exclude_re = [
    "impl fmt::Debug",
    "impl std::error::Error",
    # Equivalent mutants, each argued in docs/verification.md "Equivalent mutants".
    "replace < with <= in (Millis|Confidence)::saturating",
    "replace > with >= in (Millis|Confidence)::saturating",
    "replace < with <= in is_canonical",
    "replace \\| with \\^ in DataVersion::from_hex",
    "replace < with <= in normalize$",
    "delete match arm IsNormalized::Yes in nfc_with_map",
    "replace > with >= in nfc_with_map",
    "replace covered -> bool with false",
    "replace Lexicon::is_empty -> bool with false",
    "replace > with >= in Lexicon::substring_hit",
    "replace < with <= in qwerty_adjacent",
    "replace Repairs::none -> Self with Default::default\\(\\)",
    "replace Codebook<D>::is_empty -> bool with false",
    "replace \\| with \\^ in Hv<D>::permute",
    "replace > with >= in best_two",
]
