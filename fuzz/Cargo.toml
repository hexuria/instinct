# cargo-fuzz targets (nightly, dated: see $NIGHTLY in .github/workflows/nightly.yml).
# Not a workspace member: it needs nightly and libfuzzer-sys. Run: scripts/fuzz-smoke.sh 60
[package]
name = "instinct-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
instinct-core = { path = "../crates/instinct-core" }
instinct-graph = { path = "../crates/instinct-graph", features = ["spd-wl"] }
instinct-lexicon = { path = "../crates/instinct-lexicon" }
instinct-rules = { path = "../crates/instinct-rules" }
instinct-text = { path = "../crates/instinct-text" }

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexicon_lookup"
path = "fuzz_targets/lexicon_lookup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rules_match"
path = "fuzz_targets/rules_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_from_bytes"
path = "fuzz_targets/graph_from_bytes.rs"
test = false
doc = false
bench = false
