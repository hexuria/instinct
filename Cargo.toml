# PUA: Predictable Universal Advisor.
# Spec only for now: every member is an empty stub. See docs/spec.md.
[workspace]
resolver = "3"
members = [
    "crates/pua-core",
    "crates/pua-text",
    "crates/pua-lexicon",
    "crates/pua-rules",
    "crates/pua-hdc",
    "crates/pua-graph",
    "crates/pua-explain",
    "crates/pua-jev",
    "packs/pua-pack-autosteer",
    "packs/pua-pack-gateway-shape",
    "packs/pua-pack-bir-fields",
    "packs/pua-pack-ocr-labels",
    "packs/pua-pack-tool-selection",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hexuria/pua"
publish = false

[workspace.dependencies]
# Internal crates (path deps added when code lands; no external deps yet).

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
