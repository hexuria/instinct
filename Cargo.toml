# Instinct. See docs/spec.md and docs/plan.md.
[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/instinct-core",
    "crates/instinct-text",
    "crates/instinct-lexicon",
    "crates/instinct-rules",
    "crates/instinct-hdc",
    "crates/instinct-graph",
    "crates/instinct-explain",
    "benches",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hexuria/instinct"
publish = false

[workspace.dependencies]
# Internal crates.
instinct-core = { path = "crates/instinct-core" }
instinct-text = { path = "crates/instinct-text" }
instinct-lexicon = { path = "crates/instinct-lexicon" }
instinct-rules = { path = "crates/instinct-rules" }
instinct-hdc = { path = "crates/instinct-hdc" }
instinct-graph = { path = "crates/instinct-graph" }
instinct-explain = { path = "crates/instinct-explain" }

# External (permissive only; spec §3.1 candidate list). `pure` keeps blake3 free of C/asm builds.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
unicode-security = "0.1.2"

# Dev-only.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
gungraun = "0.20.0"

# Lints are part of the quality bar (docs/plan.md, AGENTS.md). CI runs clippy with -D warnings,
# so every "warn" below is a hard failure in CI while staying friendly during local iteration.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Library code never unwraps or expects; tests may (clippy.toml allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
# The decision path is integer-only (spec §5 rule 2). The engine has no float boundary at all:
# the Jev adapter (and its one f64 -> Confidence conversion) lives in opengrok-server.
float_arithmetic = "deny"
float_cmp = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "deny"
# Pedantic subset: on by default, with the noisy ones opted out deliberately.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
debug = 1
