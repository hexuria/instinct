# PUA: Predictable Universal Advisor. See docs/spec.md and docs/plan.md.
[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/pua-core",
    "crates/pua-text",
    "crates/pua-lexicon",
    "crates/pua-rules",
    "crates/pua-hdc",
    "crates/pua-graph",
    "crates/pua-explain",
    "crates/pua-jev",
    "packs/pua-steer",
    "packs/pua-gateway",
    "packs/pua-bir",
    "packs/pua-ocr",
    "packs/pua-toolbox",
    "benches",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hexuria/pua"
publish = false

[workspace.dependencies]
# Internal crates.
pua-core = { path = "crates/pua-core" }
pua-text = { path = "crates/pua-text" }
pua-lexicon = { path = "crates/pua-lexicon" }
pua-rules = { path = "crates/pua-rules" }
pua-hdc = { path = "crates/pua-hdc" }
pua-graph = { path = "crates/pua-graph" }
pua-explain = { path = "crates/pua-explain" }
pua-jev = { path = "crates/pua-jev" }
pua-steer = { path = "packs/pua-steer" }
pua-gateway = { path = "packs/pua-gateway" }
pua-bir = { path = "packs/pua-bir" }
pua-ocr = { path = "packs/pua-ocr" }
pua-toolbox = { path = "packs/pua-toolbox" }

# External (permissive only; spec §3.1 candidate list). `pure` keeps blake3 free of C/asm builds.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
unicode-security = "0.1.2"
unicode-script = "0.5"

# Dev-only.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
gungraun = "0.20.0"

# Lints are part of the quality bar (docs/plan.md, AGENTS.md). CI runs clippy with -D warnings,
# so every "warn" below is a hard failure in CI while staying friendly during local iteration.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Library code never unwraps or expects; tests may (clippy.toml allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
# The decision path is integer-only (spec §5 rule 2). Floats are allowed only at the pua-jev
# adapter boundary, behind a local #[allow] with a comment.
float_arithmetic = "deny"
float_cmp = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "deny"
# Pedantic subset: on by default, with the noisy ones opted out deliberately.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
debug = 1
